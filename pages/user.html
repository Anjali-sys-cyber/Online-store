<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="author"
      content="Shalu Pokhrel, Shyam Gopal Shrestha, Anjali Thapa, Sujan Prajapati"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Dashboard</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/userDashboard.css" />
    <link rel="stylesheet" href="../css/product.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/profile.css" />
    <link rel="stylesheet" href="../css/order.css?v=4" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- PROTECTED PAGE GUARD -->
    <script src="../js/auth-guard.js" defer></script>
  </head>
  <body>
    <!-- Header -->
    <div class="fixed-top-wrapper">
      <header class="header">
        <div class="header-left">
          <img
            src="../assets/images/logo.jpeg"
            alt="ShopSphere Logo"
            class="logo"
          />
          <h1>Shop<span>Sphere</span></h1>
        </div>
        <div class="header-center">
          <div class="search-box">
            <input
              type="text"
              id="searchInput"
              placeholder="Search products..."
            />
            <button onclick="searchProduct()">
              <i class="fas fa-search"></i>
            </button>
          </div>
        </div>
        <div class="header-left">
          <h1 id="userGreeting" style="color: black">Hi, User</h1>
          <a href="cart.html" class="cart-link">
            <i class="fas fa-shopping-cart"></i>
            <span class="cart-count">0</span>
            <span class="cart-text">Cart</span>
            <span class="cart-total">($0.00)</span>
          </a>
        </div>
      </header>

      <!-- Navigation -->
      <nav class="nav-bar">
        <ul class="nav-menu">
          <li><a href="#" data-page="dashboard">Dashboard</a></li>
          <li><a href="#" data-page="homeContent">Home</a></li>
          <li><a href="#" data-page="product">Products</a></li>
          <li class="dropdown">
            <a href="#"><i class="fa-solid fa-user"></i> Account</a>
            <ul class="dropdown-content">
              <!-- ✅ loads profile.html dynamically -->
              <li><a href="#" data-page="profile">My Profile</a></li>
              <li><a href="#" data-page="orders">My Orders</a></li>
              <li>
                <a
                  id="logoutLink"
                  href="/Online-store/php/logout.php?redirect=/Online-store/pages/login.html"
                  >Logout</a
                >
              </li>
            </ul>
          </li>
          <li>
            <button id="scrollTopBtn" class="scroll-btn">⬆</button>
            <button id="themeToggle" class="theme-btn">🌙 Toggle Theme</button>
          </li>
        </ul>
      </nav>
    </div>

    <!-- Main content (dynamic, filled by user.js) -->
    <main id="dashboardContent">
      <section id="dashboardWelcome">
        <h2>Welcome to the User Dashboard</h2>
        <p>Select an option from the Navbar to enjoy your shopping.</p>
      </section>
    </main>

    <!-- Footer -->
    <footer class="main-footer">
      <p>&copy; 2025 ShopSphere. All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <script src="../js/utils.js"></script>
    <script src="../js/cartManager.js"></script>
    <script src="../js/user.js"></script>
    <script src="../js/logout.js"></script>
  </body>
</html>

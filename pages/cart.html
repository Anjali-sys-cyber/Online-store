<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="author"
      content="Shalu Pokhrel, Shyam Gopal Shrestha, Anjali Thapa, Sujan Prajapati"
    />
    <title>Shopping Cart - ShopSphere</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/cart.css" />
  </head>
  <body>
    <header>
      <h1>Your Shopping Cart</h1>
      <!-- Continue Shopping link handled in JS -->
      <a href="#" id="continueShopping">
        <i class="fas fa-arrow-left"></i> Continue Shopping
      </a>
    </header>

    <main>
      <div class="cart-container">
        <div id="cart-items"></div>

        <div class="cart-summary">
          <h3>Order Summary</h3>
          <div class="summary-item">
            <span>Subtotal:</span>
            <span id="subtotal">$0.00</span>
          </div>
          <div class="summary-item">
            <span>Tax (10%):</span>
            <span id="tax">$0.00</span>
          </div>
          <div class="summary-item total">
            <span>Total:</span>
            <span id="total">$0.00</span>
          </div>
          <button type="button" id="checkout-btn">Proceed to Checkout</button>
        </div>
      </div>

      <div id="empty-cart" class="empty-cart hidden">
        <i class="fas fa-shopping-cart"></i>
        <p>Your cart is empty</p>
        <!-- Start Shopping link handled in JS -->
        <a href="#" id="startShopping">Start Shopping</a>
      </div>
    </main>

    <script src="../js/cart.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        let user = null;
        try {
          user = JSON.parse(localStorage.getItem("user")) || null;
        } catch {
          user = null;
        }

        // ✅ Check if user is logged in
        function isLoggedIn(u) {
          return !!(u && (u.user_id || u.id));
        }

        // ✅ Redirect helper
        function goToProducts() {
          if (isLoggedIn(user)) {
            // logged-in user → dashboard product page
            window.location.href = "user.html?page=product";
          } else {
            // guest → public product page
            window.location.href = "product.html";
          }
        }

        // ✅ Continue shopping
        document
          .getElementById("continueShopping")
          ?.addEventListener("click", (e) => {
            e.preventDefault();
            goToProducts();
          });

        // ✅ Start shopping
        document
          .getElementById("startShopping")
          ?.addEventListener("click", (e) => {
            e.preventDefault();
            goToProducts();
          });

        // ✅ Proceed to checkout
        document
          .getElementById("checkout-btn")
          ?.addEventListener("click", (e) => {
            e.preventDefault();
            window.location.href = "checkout.html";
          });
      });
    </script>
  </body>
</html>

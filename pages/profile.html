<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/Online-store/css/common.css" />
    <link rel="stylesheet" href="/Online-store/css/profile.css" />
    <!-- FontAwesome for payment icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      .profile-container {
        max-width: 980px;
        margin: 6rem auto 2rem;
        padding: 1.25rem;
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin: 0.75rem 0;
      }
      .form-col {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }
      .btn {
        padding: 0.7rem 1rem;
        border: 0;
        background: #1a2797;
        color: #fff;
        border-radius: 8px;
        cursor: pointer;
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .pf-msg {
        margin-top: 0.5rem;
        font-size: 0.9rem;
      }
      .ro-field {
        padding: 0.5rem;
        background: #f5f5f5;
        border-radius: 6px;
      }

      /* Payment method styles */
      .payment-methods {
        display: flex;
        gap: 1rem;
        align-items: center;
        margin: 0.5rem 0;
        flex-wrap: wrap;
      }
      .pm-option {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
        padding: 0.5rem 1rem;
        border: 1px solid #ccc;
        border-radius: 8px;
        transition: all 0.3s;
      }
      .pm-option input {
        display: none;
      }
      .pm-option i {
        font-size: 2rem;
        color: #666;
        transition: color 0.3s;
      }
      .pm-option input:checked + i {
        color: #1a2797;
      }
      #pm-placeholder {
        color: #888;
        font-style: italic;
      }

      @media (max-width: 720px) {
        .form-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="profile-container">
      <h2 style="text-align: center; margin-bottom: 1rem">My Profile</h2>

      <!-- VIEW MODE -->
      <section id="profile-view">
        <div class="form-row">
          <div class="form-col">
            <label>Full Name</label>
            <div id="po-name" class="ro-field">—</div>
          </div>
          <div class="form-col">
            <label>Email</label>
            <div id="po-email" class="ro-field">—</div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-col">
            <label>Username</label>
            <div id="po-username" class="ro-field">—</div>
          </div>
          <div class="form-col">
            <label>Phone</label>
            <div id="po-phone" class="ro-field">—</div>
          </div>
        </div>
        <h3>Address</h3>
        <div class="form-row">
          <div class="form-col">
            <label>Street</label>
            <div id="po-address" class="ro-field">—</div>
          </div>
          <div class="form-col">
            <label>City</label>
            <div id="po-city" class="ro-field">—</div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-col">
            <label>Postcode</label>
            <div id="po-postcode" class="ro-field">—</div>
          </div>
        </div>
        <div class="profile-item">
          <label>Payment Method</label>
          <div id="po-method" class="payment-methods">
            <span id="pm-placeholder">Select a payment method</span>
          </div>
        </div>

        <div style="margin-top: 1rem; text-align: right">
          <button id="btn-edit" class="btn">Edit Profile</button>
        </div>
      </section>

      <!-- EDIT MODE -->
      <section id="profile-edit" style="display: none">
        <div class="form-row">
          <div class="form-col">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" />
          </div>
          <div class="form-col">
            <label for="email">Email</label>
            <input type="email" id="email" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-col">
            <label for="username">Username</label>
            <input type="text" id="username" />
          </div>
          <div class="form-col">
            <label for="phone">Phone</label>
            <input type="text" id="phone" />
          </div>
        </div>
        <h3>Address</h3>
        <div class="form-row">
          <div class="form-col">
            <label for="address">Street</label>
            <input type="text" id="address" />
          </div>
          <div class="form-col">
            <label for="city">City</label>
            <input type="text" id="city" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-col">
            <label for="postcode">Postcode</label>
            <input type="text" id="postcode" />
          </div>
        </div>

        <!-- Payment -->
        <h3>Payment</h3>
        <div class="payment-methods">
          <label class="pm-option">
            <input type="radio" name="paymentMethod" value="mastercard" />
            <i class="fab fa-cc-mastercard"></i> Mastercard
          </label>
          <label class="pm-option">
            <input type="radio" name="paymentMethod" value="visa" />
            <i class="fab fa-cc-visa"></i> Visa
          </label>
          <label class="pm-option">
            <input type="radio" name="paymentMethod" value="paypal" />
            <i class="fab fa-cc-paypal"></i> PayPal
          </label>
        </div>

        <div class="form-row">
          <div class="form-col">
            <label for="cardNumber">Card Number</label>
            <input type="text" id="cardNumber" maxlength="19" />
          </div>
          <div class="form-col">
            <label for="expiry">Expiry (MM/YYYY)</label>
            <input type="text" id="expiry" />
          </div>
          <div class="form-col">
            <label for="cvv">CVV</label>
            <input type="text" id="cvv" maxlength="4" />
          </div>
        </div>

        <div style="margin-top: 1rem; text-align: right">
          <button id="btn-cancel" class="btn" style="background: #888">
            Cancel
          </button>
          <button id="btn-save" class="btn">Save</button>
        </div>
        <small id="pf-msg-all" class="pf-msg"></small>
      </section>
    </main>

    <script src="../js/profile.js" defer></script>
  </body>
</html>
